# Servicios de apoyo para desarrollo local. La API y la web corren en tu máquina con hot-reload.
#   docker compose -f infra/docker-compose.yml up -d
name: neirapp

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: neirapp
      POSTGRES_PASSWORD: neirapp
      POSTGRES_DB: neirapp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neirapp -d neirapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 (imágenes de productos, documentos de repartidores).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neirapp
      MINIO_ROOT_PASSWORD: neirapp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Bandeja de correo falsa: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
  minio-data:
